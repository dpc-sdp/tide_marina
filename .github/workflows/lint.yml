name: Drupal Coding Standards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install development tools
        run: composer --working-dir=tools install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: tools/vendor/bin/phpcs --standard=phpcs.xml.dist --extensions=php,module,inc,install,test,profile,theme --ignore=vendor,node_modules --report=full
